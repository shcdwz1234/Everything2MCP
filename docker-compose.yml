# Everything2MCP HTTP UI on 8742.
# Required for any non-loopback exposure: set EVERYTHING2MCP_HTTP_TOKEN.
# Example:
#   EVERYTHING2MCP_HTTP_TOKEN=$(openssl rand -hex 24) docker compose up --build

services:
  everything2mcp:
    build: .
    ports:
      # Bind host loopback only by default (safe). Change left side if you need LAN access —
      # and only with EVERYTHING2MCP_HTTP_TOKEN set.
      - "127.0.0.1:8742:8742"
    environment:
      EVERYTHING2MCP_TRANSPORT: http
      EVERYTHING2MCP_HTTP_HOST: "0.0.0.0"
      EVERYTHING2MCP_HTTP_PORT: "8742"
      EVERYTHING2MCP_DATA_DIR: /data
      # Set a strong token before exposing beyond this machine:
      # EVERYTHING2MCP_HTTP_TOKEN: "replace-me"
      EVERYTHING2MCP_HTTP_TOKEN: ${EVERYTHING2MCP_HTTP_TOKEN:-}
    volumes:
      - e2m-data:/data
    restart: unless-stopped

volumes:
  e2m-data:
